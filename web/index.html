<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meine App</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center;
           font-family: system-ui, sans-serif; background: #F5F0E9; color: #112250; }
    main { text-align: center; padding: 2rem; }
    button { font: inherit; padding: .8rem 1.6rem; border: 0; border-radius: 999px;
             background: #3C507D; color: #fff; }
  </style>
</head>
<body>
  <main>
    <h1>Es funktioniert!</h1>
    <p>Diese Seite steckt direkt in der App und läuft auch offline.<br>
       Ersetze den Ordner <code>web/</code> durch deine eigenen Dateien.</p>
    <button id="btn">Tippen</button>
    <p id="out"></p>
  </main>
  <script>
    let n = Number(localStorage.getItem('n') || 0);
    const out = document.getElementById('out');
    const show = () => out.textContent = n ? `${n}× getippt` : '';
    document.getElementById('btn').onclick = () => { localStorage.setItem('n', ++n); show(); };
    show();
  </script>
</body>
</html>
